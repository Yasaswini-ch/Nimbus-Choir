<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nimbus Choir — sound engine tuning</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<main>
  <h1>Tune by ear</h1>
  <p class="sub">Simulated drifting clouds driving the real sound engine, for tuning <code>audio/config.js</code> without a camera.</p>

  <div class="row">
    <button id="go" class="b" style="position: static; width: auto;">Start</button>
  </div>

  <div class="panel">
    <label>Tension: <b id="tv">0.00</b>
      <input id="tension" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label>Clouds: <b id="nv">5</b>
      <input id="count" type="range" min="1" max="12" step="1" value="5"></label>
    <label>Scale
      <select id="scale"><option value="penta">Pentatonic</option><option value="dorian">Dorian</option><option value="blues">Blues</option></select></label>
    <label>Root
      <select id="root"><option value="0">C</option><option value="2">D</option><option value="4">E</option><option value="7">G</option><option value="9">A</option></select></label>
  </div>

  <div class="row">
    <button class="b" id="storm">Storm front</button>
    <button class="b" id="calm">Clear skies</button>
    <button class="b" id="patch">Toggle patch mode</button>
    <button class="b" id="mute">Mute</button>
  </div>

  <div class="legend">
    <span>Cirrus</span><span>Glassy sine hum, quick high sparkles</span>
    <span>Cumulus</span><span>Warm round pad, music-box chimes</span>
    <span>Stratus</span><span>Deep hum, no chimes</span>
    <span>Cumulonimbus</span><span>Dark pad, slow low bells, louder as it grows</span>
  </div>
</main>
<script type="module" src="/src/audioDemoMain.js"></script>
</body>
</html>
